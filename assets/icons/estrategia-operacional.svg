<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra y resplandor -->
    <filter id="op-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="op-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- CARROCERÍA AMARILLA INDUSTRIAL (MONTACARGAS) -->
    <linearGradient id="op-fork-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="op-yellow-bright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- CHASIS / CONTRAPESO OSCURO -->
    <linearGradient id="op-dark-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- RUEDAS DE CAUCHO INDUSTRIAL -->
    <radialGradient id="op-wheel-rubber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- MÁSTIL Y HORQUILLAS METÁLICAS -->
    <linearGradient id="op-mast-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- ESTIBA DE MADERA -->
    <linearGradient id="op-pallet-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- CAJAS BLANCAS DE DERIVADOS LÁCTEOS -->
    <linearGradient id="op-box-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="op-box-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="op-box-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- FLECHAS DE ROTACIÓN FIFO / FEFO (VERDE ESMERALDA Y ORO) -->
    <linearGradient id="op-arrow-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- ================= SOMBRAS DE CONTACTO ================= -->
  <!-- Sombra bajo montacargas y estiba -->
  <ellipse cx="25" cy="57" rx="18" ry="3.5" fill="#0f172a" opacity="0.25" filter="url(#op-blur)"/>
  <ellipse cx="61" cy="56" rx="20" ry="3.2" fill="#0f172a" opacity="0.22" filter="url(#op-blur)"/>
  <ellipse cx="44" cy="57" rx="38" ry="2" fill="#020617" opacity="0.2"/>

  <!-- ================= MONTACARGAS INDUSTRIAL (IZQUIERDA) ================= -->
  <!-- Cabina y Jaula de Seguridad (Barras antivuelco) -->
  <g stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pilar trasero -->
    <line x1="16" y1="21" x2="17" y2="38"/>
    <!-- Techo protector -->
    <line x1="15" y1="21" x2="33" y2="21"/>
    <!-- Pilar delantero inclinado -->
    <line x1="33" y1="21" x2="31" y2="38"/>
    <!-- Rejilla de techo -->
    <line x1="21" y1="21" x2="21" y2="37" stroke-width="1.2"/>
    <line x1="27" y1="21" x2="27" y2="37" stroke-width="1.2"/>
  </g>
  <!-- Asiento del operador -->
  <rect x="18" y="32" width="6" height="5" rx="1.5" fill="#0f172a"/>
  <!-- Volante de dirección -->
  <line x1="27" y1="31" x2="29" y2="35" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="27" cy="30.5" r="2" stroke="#0f172a" stroke-width="1.2" fill="none"/>

  <!-- Carrocería Amarilla / Contrapeso Posterior -->
  <!-- Contrapeso curvado trasero -->
  <path d="M 12,38 C 11,38 9,41 9,47 C 9,51 11,53 14,53 L 34,53 C 35,53 36,51 36,49 L 36,39 C 36,38 34,38 33,38 Z" fill="url(#op-fork-yellow)"/>
  <!-- Relieve superior amarillo brillante -->
  <path d="M 12,38 L 33,38 L 33,41 L 11.5,41 C 11.5,39.5 11.8,38 12,38 Z" fill="url(#op-yellow-bright)"/>
  <!-- Faldón inferior oscuro del chasis -->
  <rect x="14" y="49" width="22" height="4.5" fill="url(#op-dark-steel)"/>

  <!-- Ruedas Industriales con rines -->
  <!-- Rueda trasera -->
  <g>
    <circle cx="16" cy="52" r="5" fill="url(#op-wheel-rubber)"/>
    <circle cx="16" cy="52" r="2.5" fill="#64748b"/>
    <circle cx="16" cy="52" r="1.2" fill="#0f172a"/>
  </g>
  <!-- Rueda delantera motriz -->
  <g>
    <circle cx="34" cy="51.5" r="5.5" fill="url(#op-wheel-rubber)"/>
    <circle cx="34" cy="51.5" r="2.8" fill="#64748b"/>
    <circle cx="34" cy="51.5" r="1.3" fill="#0f172a"/>
  </g>

  <!-- Mástil vertical de elevación -->
  <rect x="36.5" y="14" width="2.6" height="39" rx="0.8" fill="url(#op-mast-steel)"/>
  <rect x="39.8" y="14" width="2.6" height="39" rx="0.8" fill="url(#op-mast-steel)"/>
  <!-- Travesaños del mástil -->
  <rect x="36" y="20" width="6.8" height="2" fill="#0f172a"/>
  <rect x="36" y="32" width="6.8" height="2" fill="#0f172a"/>
  <!-- Cadena / pistón hidráulico central -->
  <line x1="39.4" y1="16" x2="39.4" y2="48" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Tablero porta-horquillas (Carriage) -->
  <rect x="38" y="42" width="4.5" height="8" rx="1" fill="#1e293b"/>

  <!-- Horquillas de acero (Forks) que penetran la estiba -->
  <path d="M 40.5,49 L 44,49 L 75,49 L 75,50.8 L 40.5,50.8 Z" fill="#0f172a"/>

  <!-- ================= ESTIBA DE MADERA (PALLET) ================= -->
  <!-- Elevada ligeramente por las horquillas -->
  <g transform="translate(42, 43)">
    <!-- Patines / bloques de apoyo inferiores -->
    <rect x="2" y="5.5" width="4" height="3.5" rx="0.5" fill="#78350f"/>
    <rect x="15" y="5.5" width="4" height="3.5" rx="0.5" fill="#78350f"/>
    <rect x="28" y="5.5" width="4" height="3.5" rx="0.5" fill="#78350f"/>
    <!-- Huecos para horquillas -->
    <!-- Tablas superiores del pallet -->
    <rect x="0" y="3.5" width="34" height="2.2" rx="0.6" fill="url(#op-pallet-wood)"/>
    <line x1="1" y1="4.6" x2="33" y2="4.6" stroke="#fde68a" stroke-width="0.5" opacity="0.6"/>
    <!-- Clavos / detalles de madera -->
    <circle cx="4" cy="4.6" r="0.4" fill="#451a03"/>
    <circle cx="17" cy="4.6" r="0.4" fill="#451a03"/>
    <circle cx="30" cy="4.6" r="0.4" fill="#451a03"/>
  </g>

  <!-- ================= CAJAS DE DERIVADOS LÁCTEOS (BLANCAS Y ORDENADAS) ================= -->
  <!-- Estibadas ordenadamente: 2 en base, 2 en piso superior -->
  <g transform="translate(43, 19)">
    <!-- FILA INFERIOR -->
    <!-- Caja 1 (Inferior izquierda) -->
    <g transform="translate(1, 13)">
      <rect x="0" y="0" width="14" height="14" rx="1.5" fill="url(#op-box-front)" stroke="#cbd5e1" stroke-width="0.6"/>
      <!-- Sello / logo lácteo azul (vaquita simplificada) -->
      <path d="M 4,4.5 C 4,3.5 5,3 7,3 C 9,3 10,3.5 10,4.5 C 10,6 8.5,6.5 8.5,8 L 5.5,8 C 5.5,6.5 4,6 4,4.5 Z" fill="#0284c7" opacity="0.85"/>
      <circle cx="5" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="9" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="7" cy="6.2" r="1" fill="#38bdf8"/>
      <!-- Cinta de precinto o lote -->
      <line x1="2" y1="10.5" x2="12" y2="10.5" stroke="#94a3b8" stroke-width="0.8"/>
    </g>

    <!-- Caja 2 (Inferior derecha) -->
    <g transform="translate(17, 13)">
      <rect x="0" y="0" width="14" height="14" rx="1.5" fill="url(#op-box-front)" stroke="#cbd5e1" stroke-width="0.6"/>
      <!-- Logo azul lácteo -->
      <path d="M 4,4.5 C 4,3.5 5,3 7,3 C 9,3 10,3.5 10,4.5 C 10,6 8.5,6.5 8.5,8 L 5.5,8 C 5.5,6.5 4,6 4,4.5 Z" fill="#0284c7" opacity="0.85"/>
      <circle cx="5" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="9" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="7" cy="6.2" r="1" fill="#38bdf8"/>
      <!-- Cinta -->
      <line x1="2" y1="10.5" x2="12" y2="10.5" stroke="#94a3b8" stroke-width="0.8"/>
    </g>

    <!-- FILA SUPERIOR -->
    <!-- Caja 3 (Superior izquierda) -->
    <g transform="translate(1, -2)">
      <rect x="0" y="0" width="14" height="14" rx="1.5" fill="url(#op-box-front)" stroke="#cbd5e1" stroke-width="0.6"/>
      <!-- Logo lácteo -->
      <path d="M 4,4.5 C 4,3.5 5,3 7,3 C 9,3 10,3.5 10,4.5 C 10,6 8.5,6.5 8.5,8 L 5.5,8 C 5.5,6.5 4,6 4,4.5 Z" fill="#0284c7" opacity="0.85"/>
      <circle cx="5" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="9" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="7" cy="6.2" r="1" fill="#38bdf8"/>
      <!-- Cinta -->
      <line x1="2" y1="10.5" x2="12" y2="10.5" stroke="#94a3b8" stroke-width="0.8"/>
    </g>

    <!-- Caja 4 (Superior derecha) -->
    <g transform="translate(17, -2)">
      <rect x="0" y="0" width="14" height="14" rx="1.5" fill="url(#op-box-front)" stroke="#cbd5e1" stroke-width="0.6"/>
      <!-- Logo lácteo -->
      <path d="M 4,4.5 C 4,3.5 5,3 7,3 C 9,3 10,3.5 10,4.5 C 10,6 8.5,6.5 8.5,8 L 5.5,8 C 5.5,6.5 4,6 4,4.5 Z" fill="#0284c7" opacity="0.85"/>
      <circle cx="5" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="9" cy="4.2" r="0.6" fill="#ffffff"/>
      <circle cx="7" cy="6.2" r="1" fill="#38bdf8"/>
      <!-- Cinta -->
      <line x1="2" y1="10.5" x2="12" y2="10.5" stroke="#94a3b8" stroke-width="0.8"/>
    </g>
  </g>

  <!-- ================= FLECHAS DINÁMICAS DE ROTACIÓN (FIFO / FEFO) ================= -->
  <!-- Bucle dinámico superior de rotación de inventarios -->
  <g transform="translate(59, 13)">
    <!-- Arco de rotación en órbita fluida -->
    <path d="M -14,2 C -14,-7 14,-7 14,2" fill="none" stroke="url(#op-arrow-grad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 1.5"/>
    <!-- Punta de flecha dinámica hacia la derecha/avance -->
    <polygon points="17,1 12,5 13.5,0.5" fill="#16a34a"/>
  </g>
</svg>
