<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="perm-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Bisel exterior cromado brillante -->
    <linearGradient id="perm-chrome-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Aro interior metálico -->
    <linearGradient id="perm-inner-bezel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Esfera del cronómetro -->
    <radialGradient id="perm-dial" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Brillo del cristal del cronómetro -->
    <linearGradient id="perm-glass-glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cartón Cajas -->
    <linearGradient id="perm-box-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5cfa6"/>
      <stop offset="100%" stop-color="#d4975c"/>
    </linearGradient>
    <linearGradient id="perm-box-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c88448"/>
      <stop offset="100%" stop-color="#9c5e29"/>
    </linearGradient>
    <linearGradient id="perm-box-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b57339"/>
      <stop offset="100%" stop-color="#7c431b"/>
    </linearGradient>

    <linearGradient id="perm-tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Sombras de contacto -->
  <ellipse cx="28" cy="58" rx="22" ry="3.5" fill="#0f172a" opacity="0.22" filter="url(#perm-blur)"/>
  <ellipse cx="64" cy="58" rx="18" ry="3.5" fill="#0f172a" opacity="0.22" filter="url(#perm-blur)"/>
  <ellipse cx="28" cy="57.5" rx="19" ry="2" fill="#090d16" opacity="0.28"/>

  <!-- ================= CAJAS DE ALMACENAMIENTO (DERECHA) ================= -->
  <!-- Caja Inferior (Base) -->
  <g>
    <!-- Cara Frontal -->
    <polygon points="50,38 72,42 72,57 50,53" fill="url(#perm-box-front)"/>
    <!-- Cara Lateral Derecha -->
    <polygon points="72,42 82,37 82,51 72,57" fill="url(#perm-box-side)"/>
    <!-- Cara Superior -->
    <polygon points="50,38 60,33 82,37 72,42" fill="url(#perm-box-top)"/>
    <!-- Cinta adhesiva -->
    <polygon points="59,39.7 63,40.4 63,55.5 59,54.7" fill="url(#perm-tape)"/>
    <!-- Etiqueta de despacho -->
    <polygon points="52,43 56,43.7 56,48 52,47.3" fill="#ffffff" opacity="0.9"/>
    <line x1="53" y1="44.8" x2="55" y2="45.1" stroke="#334155" stroke-width="0.5"/>
    <line x1="53" y1="46" x2="55" y2="46.3" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- Caja Superior (Apilada) -->
  <g>
    <!-- Sombra proyectada en la caja inferior -->
    <polygon points="53,38 74,42 75,44 54,40" fill="#000000" opacity="0.18"/>
    <!-- Cara Frontal -->
    <polygon points="53,23 74,27 74,40 53,36" fill="url(#perm-box-front)"/>
    <!-- Cara Lateral Derecha -->
    <polygon points="74,27 83,22.5 83,35 74,40" fill="url(#perm-box-side)"/>
    <!-- Cara Superior -->
    <polygon points="53,23 62,18.5 83,22.5 74,27" fill="url(#perm-box-top)"/>
    <!-- Cinta adhesiva -->
    <polygon points="61.5,24.6 65.5,25.4 65.5,38.5 61.5,37.6" fill="url(#perm-tape)"/>
    <!-- Etiqueta código QR / frágil -->
    <polygon points="55,27.5 59.5,28.3 59.5,32.5 55,31.7" fill="#ffffff" opacity="0.9"/>
    <circle cx="57.2" cy="29.8" r="0.9" fill="#15803d"/>
  </g>

  <!-- ================= CRONÓMETRO METÁLICO (IZQUIERDA) ================= -->
  <!-- Anilla de sujeción cromada superior -->
  <path d="M24 7 C24 3, 32 3, 32 7" stroke="url(#perm-chrome-bezel)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  
  <!-- Pulsador / corona superior cromada -->
  <rect x="25.5" y="6.5" width="5" height="5" rx="1" fill="url(#perm-chrome-bezel)"/>
  <rect x="24.5" y="10.5" width="7" height="2" rx="0.5" fill="url(#perm-inner-bezel)"/>

  <!-- Pulsador lateral derecho secundario -->
  <rect x="42.5" y="16.5" width="4" height="3" rx="0.8" transform="rotate(35 44 18)" fill="url(#perm-chrome-bezel)"/>

  <!-- Cuerpo exterior cromado (Caja del cronómetro) -->
  <circle cx="28" cy="35" r="22" fill="url(#perm-chrome-bezel)"/>
  <!-- Aro interior acanalado -->
  <circle cx="28" cy="35" r="19.5" fill="url(#perm-inner-bezel)"/>
  <!-- Esfera del reloj (Dial blanco níveo) -->
  <circle cx="28" cy="35" r="17.5" fill="url(#perm-dial)"/>
  <!-- Borde tenue interior del dial -->
  <circle cx="28" cy="35" r="17.5" stroke="#94a3b8" stroke-width="0.4" fill="none"/>

  <!-- Escala y marcas horarias / minuteras -->
  <!-- Marcas de 5 minutos (12 principales) -->
  <line x1="28" y1="18.5" x2="28" y2="21.5" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="51.5" x2="28" y2="48.5" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11.5" y1="35" x2="14.5" y2="35" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44.5" y1="35" x2="41.5" y2="35" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Diagonales principales -->
  <line x1="39.5" y1="23.5" x2="37.5" y2="25.5" stroke="#1e293b" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16.5" y1="46.5" x2="18.5" y2="44.5" stroke="#1e293b" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16.5" y1="23.5" x2="18.5" y2="25.5" stroke="#1e293b" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="39.5" y1="46.5" x2="37.5" y2="44.5" stroke="#1e293b" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Marcas intermedias pequeñas (segundos) -->
  <circle cx="34.2" cy="19.5" r="0.4" fill="#64748b"/>
  <circle cx="38" cy="21.5" r="0.4" fill="#64748b"/>
  <circle cx="42.5" cy="27.5" r="0.4" fill="#64748b"/>
  <circle cx="43.5" cy="31.2" r="0.4" fill="#64748b"/>
  <circle cx="43.5" cy="38.8" r="0.4" fill="#64748b"/>
  <circle cx="42.5" cy="42.5" r="0.4" fill="#64748b"/>
  <circle cx="34.2" cy="50.5" r="0.4" fill="#64748b"/>
  <circle cx="21.8" cy="50.5" r="0.4" fill="#64748b"/>
  <circle cx="13.5" cy="38.8" r="0.4" fill="#64748b"/>
  <circle cx="13.5" cy="31.2" r="0.4" fill="#64748b"/>
  <circle cx="17.8" cy="20.5" r="0.4" fill="#64748b"/>
  <circle cx="21.8" cy="19.5" r="0.4" fill="#64748b"/>

  <!-- Números principales (60, 15, 30, 45) -->
  <text x="28" y="24" font-family="'Poppins', sans-serif" font-size="3.2" font-weight="700" fill="#334155" text-anchor="middle">60</text>
  <text x="39" y="36.2" font-family="'Poppins', sans-serif" font-size="3.2" font-weight="700" fill="#334155" text-anchor="middle">15</text>
  <text x="28" y="47.2" font-family="'Poppins', sans-serif" font-size="3.2" font-weight="700" fill="#334155" text-anchor="middle">30</text>
  <text x="17" y="36.2" font-family="'Poppins', sans-serif" font-size="3.2" font-weight="700" fill="#334155" text-anchor="middle">45</text>

  <!-- Subdial acumulador de minutos pequeño -->
  <circle cx="28" cy="29.5" r="4.2" stroke="#94a3b8" stroke-width="0.5" fill="#f1f5f9"/>
  <line x1="28" y1="29.5" x2="29.5" y2="27.5" stroke="#dc2626" stroke-width="0.6" stroke-linecap="round"/>
  <circle cx="28" cy="29.5" r="0.6" fill="#1e293b"/>

  <!-- Manecilla principal roja (Segundero indicador de permanencia) -->
  <!-- Sombra de la manecilla -->
  <line x1="28.8" y1="36" x2="36.8" y2="24" stroke="#000000" stroke-width="1.3" stroke-linecap="round" opacity="0.2"/>
  <!-- Aguja roja esbelta -->
  <line x1="25.5" y1="38" x2="36" y2="23" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Contrapeso de la aguja -->
  <circle cx="25.5" cy="38" r="0.9" fill="#991b1b"/>
  <!-- Eje central cromado -->
  <circle cx="28" cy="35" r="2.2" fill="url(#perm-chrome-bezel)"/>
  <circle cx="28" cy="35" r="1.1" fill="#dc2626"/>

  <!-- Reflejo curvo del cristal superior -->
  <path d="M14 28 A17 17 0 0 1 42 28 A15.5 13 0 0 0 14 28 Z" fill="url(#perm-glass-glare)"/>
</svg>