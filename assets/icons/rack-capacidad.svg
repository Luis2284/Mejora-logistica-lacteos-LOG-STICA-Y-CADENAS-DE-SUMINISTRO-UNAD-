<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="cap-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    
    <!-- Acero Azul Postes -->
    <linearGradient id="cap-steel-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cap-steel-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    
    <!-- Largueros Naranja Industrial -->
    <linearGradient id="cap-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="25%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="cap-beam-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Madera Pallet -->
    <linearGradient id="cap-wood-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cap-wood-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Cartón Cajas -->
    <linearGradient id="cap-box-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4975c"/>
      <stop offset="15%" stop-color="#c88448"/>
      <stop offset="85%" stop-color="#b57339"/>
      <stop offset="100%" stop-color="#9c5e29"/>
    </linearGradient>
    <linearGradient id="cap-box-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa075"/>
      <stop offset="15%" stop-color="#bd8d5e"/>
      <stop offset="85%" stop-color="#a97849"/>
      <stop offset="100%" stop-color="#8e6137"/>
    </linearGradient>
    <linearGradient id="cap-box-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5caa0"/>
      <stop offset="100%" stop-color="#dfa66e"/>
    </linearGradient>
    <linearGradient id="cap-tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Sombra de contacto suave -->
  <ellipse cx="44" cy="60" rx="40" ry="3.5" fill="#0f172a" opacity="0.22" filter="url(#cap-blur)"/>
  <ellipse cx="44" cy="59.5" rx="36" ry="2" fill="#090d16" opacity="0.28"/>

  <!-- Pallet de madera inferior -->
  <rect x="8" y="55" width="9" height="4" rx="0.8" fill="url(#cap-wood-front)"/>
  <rect x="39.5" y="55" width="9" height="4" rx="0.8" fill="url(#cap-wood-front)"/>
  <rect x="71" y="55" width="9" height="4" rx="0.8" fill="url(#cap-wood-front)"/>
  <rect x="5" y="52.5" width="78" height="2.8" rx="0.8" fill="url(#cap-wood-top)"/>
  <rect x="5" y="54" width="78" height="1.3" rx="0.4" fill="url(#cap-wood-front)"/>

  <!-- Cruces de arriostramiento traseras -->
  <path d="M10 12 L78 33 M78 12 L10 33 M10 33 L78 54 M78 33 L10 54" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>

  <!-- Postes traseros metálicos -->
  <rect x="11" y="6" width="3.5" height="47" fill="#1e3a8a" opacity="0.5"/>
  <rect x="73.5" y="6" width="3.5" height="47" fill="#172554" opacity="0.5"/>

  <!-- ================= NIVEL SUPERIOR: CAJAS ================= -->
  <!-- Caja Superior 1 (Izquierda) -->
  <g>
    <rect x="13.5" y="14" width="18" height="17.5" rx="1.2" fill="url(#cap-box-1)"/>
    <path d="M13.5 14 L31.5 14 L30.5 15.6 L14.5 15.6 Z" fill="url(#cap-box-top)"/>
    <rect x="21.2" y="14" width="2.6" height="17.5" fill="url(#cap-tape)"/>
    <rect x="13.5" y="19" width="18" height="1.8" fill="url(#cap-tape)" opacity="0.85"/>
    <rect x="15" y="22.5" width="4.5" height="5.5" rx="0.6" fill="#ffffff" opacity="0.95"/>
    <line x1="16" y1="24.5" x2="18.2" y2="24.5" stroke="#334155" stroke-width="0.6"/>
    <line x1="16" y1="26" x2="18.2" y2="26" stroke="#334155" stroke-width="0.6"/>
    <rect x="31" y="14" width="0.8" height="17.5" fill="#000000" opacity="0.18"/>
  </g>

  <!-- Caja Superior 2 (Centro) -->
  <g>
    <rect x="32.5" y="12.5" width="22.5" height="19" rx="1.2" fill="url(#cap-box-2)"/>
    <path d="M32.5 12.5 L55 12.5 L53.8 14.3 L33.8 14.3 Z" fill="url(#cap-box-top)"/>
    <rect x="42.5" y="12.5" width="2.8" height="19" fill="url(#cap-tape)"/>
    <rect x="32.5" y="18" width="22.5" height="2" fill="url(#cap-tape)" opacity="0.85"/>
    <rect x="34.5" y="22" width="6.5" height="6.5" rx="0.6" fill="#ffffff" opacity="0.95"/>
    <line x1="36" y1="24" x2="39.5" y2="24" stroke="#1e293b" stroke-width="0.7"/>
    <line x1="36" y1="25.5" x2="39.5" y2="25.5" stroke="#1e293b" stroke-width="0.7"/>
    <line x1="36" y1="27" x2="39" y2="27" stroke="#1e293b" stroke-width="0.5"/>
    <rect x="54.5" y="12.5" width="0.8" height="19" fill="#000000" opacity="0.18"/>
  </g>

  <!-- Caja Superior 3 (Derecha) -->
  <g>
    <rect x="56" y="14" width="18" height="17.5" rx="1.2" fill="url(#cap-box-1)"/>
    <path d="M56 14 L74 14 L73 15.6 L57 15.6 Z" fill="url(#cap-box-top)"/>
    <rect x="63.8" y="14" width="2.6" height="17.5" fill="url(#cap-tape)"/>
    <rect x="56" y="19" width="18" height="1.8" fill="url(#cap-tape)" opacity="0.85"/>
    <rect x="68" y="22" width="4.5" height="5.5" rx="0.6" fill="#ffffff" opacity="0.95"/>
    <polygon points="70.2,23.5 69,25.5 71.4,25.5" fill="#ea580c"/>
  </g>

  <!-- Larguero Naranja Superior -->
  <rect x="7" y="31.5" width="74" height="4" rx="1" fill="url(#cap-beam)"/>
  <rect x="7" y="34.3" width="74" height="1.2" fill="url(#cap-beam-dark)"/>
  <circle cx="9.5" cy="33.5" r="0.9" fill="#fef08a"/>
  <circle cx="78.5" cy="33.5" r="0.9" fill="#fef08a"/>

  <!-- ================= NIVEL INFERIOR: CAJAS ================= -->
  <!-- Caja Inferior 1 (Izquierda) -->
  <g>
    <rect x="13.5" y="35.5" width="18" height="17" rx="1.2" fill="url(#cap-box-2)"/>
    <rect x="21.2" y="35.5" width="2.6" height="17" fill="url(#cap-tape)"/>
    <rect x="13.5" y="41" width="18" height="1.8" fill="url(#cap-tape)" opacity="0.85"/>
    <rect x="15" y="44.5" width="4.5" height="5" rx="0.6" fill="#ffffff" opacity="0.95"/>
    <line x1="16" y1="46.5" x2="18.5" y2="46.5" stroke="#334155" stroke-width="0.6"/>
    <line x1="16" y1="48" x2="18.5" y2="48" stroke="#334155" stroke-width="0.6"/>
  </g>

  <!-- Caja Inferior 2 (Centro) -->
  <g>
    <rect x="32.5" y="35.5" width="22.5" height="17" rx="1.2" fill="url(#cap-box-1)"/>
    <rect x="42.5" y="35.5" width="2.8" height="17" fill="url(#cap-tape)"/>
    <rect x="32.5" y="41" width="22.5" height="1.8" fill="url(#cap-tape)" opacity="0.85"/>
    <rect x="48" y="44" width="5.5" height="5" rx="0.6" fill="#ffffff" opacity="0.95"/>
    <line x1="49.5" y1="46" x2="52" y2="46" stroke="#1e293b" stroke-width="0.6"/>
    <line x1="49.5" y1="47.5" x2="52" y2="47.5" stroke="#1e293b" stroke-width="0.6"/>
  </g>

  <!-- Caja Inferior 3 (Derecha) -->
  <g>
    <rect x="56" y="35.5" width="18" height="17" rx="1.2" fill="url(#cap-box-2)"/>
    <rect x="63.8" y="35.5" width="2.6" height="17" fill="url(#cap-tape)"/>
    <rect x="56" y="41" width="18" height="1.8" fill="url(#cap-tape)" opacity="0.85"/>
    <rect x="58" y="44.5" width="4.5" height="5" rx="0.6" fill="#ffffff" opacity="0.95"/>
    <circle cx="60.2" cy="47" r="1.2" fill="#22c55e"/>
  </g>

  <!-- Larguero Naranja Inferior -->
  <rect x="7" y="52.5" width="74" height="4" rx="1" fill="url(#cap-beam)"/>
  <rect x="7" y="55.3" width="74" height="1.2" fill="url(#cap-beam-dark)"/>
  <circle cx="9.5" cy="54.5" r="0.9" fill="#fef08a"/>
  <circle cx="78.5" cy="54.5" r="0.9" fill="#fef08a"/>

  <!-- ================= POSTES METÁLICOS DELANTEROS (AZUL INDUSTRIAL) ================= -->
  <!-- Poste Frontal Izquierdo -->
  <g>
    <rect x="6" y="5" width="5.5" height="52" rx="1.2" fill="url(#cap-steel-l)"/>
    <rect x="7.7" y="8" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="7.7" y="15" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="7.7" y="22" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="7.7" y="29" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="7.7" y="36" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="7.7" y="43" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="7.7" y="50" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="5" y="55.5" width="7.5" height="2.5" rx="0.8" fill="#0f172a"/>
    <rect x="5.5" y="4" width="6.5" height="2" rx="0.8" fill="#60a5fa"/>
  </g>

  <!-- Poste Frontal Derecho -->
  <g>
    <rect x="76.5" y="5" width="5.5" height="52" rx="1.2" fill="url(#cap-steel-r)"/>
    <rect x="78.2" y="8" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="78.2" y="15" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="78.2" y="22" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="78.2" y="29" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="78.2" y="36" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="78.2" y="43" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="78.2" y="50" width="2" height="3" rx="0.6" fill="#0f172a" opacity="0.75"/>
    <rect x="75.5" y="55.5" width="7.5" height="2.5" rx="0.8" fill="#0f172a"/>
    <rect x="76" y="4" width="6.5" height="2" rx="0.8" fill="#3b82f6"/>
  </g>
</svg>