<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="scan-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Carcasa Negra / Grafito del Escáner (Mate y Relieve 3D) -->
    <linearGradient id="scan-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Empuñadura ergonómica -->
    <linearGradient id="scan-grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gatillo Amarillo / Ámbar Industrial -->
    <linearGradient id="scan-trigger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Bisel de la ventana óptica delantera -->
    <linearGradient id="scan-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Cristal de lectura óptico (Verde esmeralda oscuro / antirreflejo) -->
    <linearGradient id="scan-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Haz de luz roja del láser (Campo difuso) -->
    <linearGradient id="scan-laser-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#f87171" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Línea láser roja brillante central -->
    <linearGradient id="scan-laser-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fecaca"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Etiqueta blanca de código de barras con bisel 3D -->
    <linearGradient id="label-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Sombras de contacto de la base -->
  <ellipse cx="23" cy="58" rx="14" ry="3.5" fill="#0f172a" opacity="0.22" filter="url(#scan-blur)"/>
  <ellipse cx="66" cy="57" rx="18" ry="3.5" fill="#0f172a" opacity="0.2" filter="url(#scan-blur)"/>
  <ellipse cx="23" cy="57.5" rx="11" ry="2" fill="#090d16" opacity="0.25"/>

  <!-- ================= HAZ LÁSER ROJO ================= -->
  <!-- Cono / abanico de luz roja proyectada -->
  <polygon points="34.5,21 34.5,27 82,39 82,23" fill="url(#scan-laser-glow)" opacity="0.6"/>

  <!-- ================= ETIQUETA DE CÓDIGO DE BARRAS (DERECHA) ================= -->
  <!-- Sombra propia de la etiqueta -->
  <rect x="52" y="22.5" width="31" height="23" rx="2.5" fill="#0f172a" opacity="0.12" filter="url(#scan-blur)"/>
  <!-- Papel autoadhesivo de la etiqueta -->
  <rect x="51" y="21" width="31" height="22" rx="2.5" fill="url(#label-bg)" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- BARRAS VERTICALES DEL CÓDIGO DE BARRAS -->
  <!-- Grupo de barras con diferentes anchos y espacios realistas -->
  <g fill="#0f172a">
    <!-- Guarda izquierda -->
    <rect x="54" y="23.5" width="0.8" height="13.5"/>
    <rect x="55.3" y="23.5" width="0.8" height="13.5"/>
    
    <!-- Bloque de datos -->
    <rect x="57" y="23.5" width="1.6" height="12"/>
    <rect x="59.3" y="23.5" width="0.9" height="12"/>
    <rect x="61" y="23.5" width="2.2" height="12"/>
    <rect x="64" y="23.5" width="0.7" height="12"/>
    
    <!-- Guarda central -->
    <rect x="65.5" y="23.5" width="0.8" height="13.5"/>
    <rect x="67" y="23.5" width="0.8" height="13.5"/>
    
    <!-- Bloque de datos 2 -->
    <rect x="68.8" y="23.5" width="1.8" height="12"/>
    <rect x="71.3" y="23.5" width="0.8" height="12"/>
    <rect x="72.8" y="23.5" width="1.4" height="12"/>
    <rect x="75" y="23.5" width="2.4" height="12"/>
    
    <!-- Guarda derecha -->
    <rect x="78.2" y="23.5" width="0.8" height="13.5"/>
    <rect x="79.6" y="23.5" width="0.8" height="13.5"/>
  </g>

  <!-- Números al pie del código de barras -->
  <text x="66.5" y="40.5" font-family="'Courier New', monospace, sans-serif" font-size="2.6" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.4">7702010402</text>

  <!-- LÍNEA LÁSER ROJA ACTIVA SOBRE EL CÓDIGO DE BARRAS -->
  <!-- Resplandor exterior difuso de la línea -->
  <line x1="33" y1="24" x2="82.5" y2="30.5" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round" opacity="0.35"/>
  <!-- Haz láser central brillante -->
  <line x1="33" y1="24" x2="82.5" y2="30.5" stroke="url(#scan-laser-beam)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Núcleo blanco del láser -->
  <line x1="33" y1="24" x2="48" y2="26" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
  <!-- Punto focal de lectura en el código -->
  <circle cx="66" cy="28.4" r="1.6" fill="#fecaca" opacity="0.8"/>
  <circle cx="66" cy="28.4" r="0.8" fill="#ffffff"/>

  <!-- ================= PISTOLA ESCÁNER (IZQUIERDA) ================= -->
  <!-- Sombra proyectada del cabezal hacia el mango -->
  <path d="M19 25 C19 32, 21 44, 25 54 L20 54 C16 43, 14 32, 14 25 Z" fill="#020617" opacity="0.3"/>

  <!-- Mango / Empuñadura ergonómica -->
  <path d="M16 23 C15 32, 17 45, 23 54 C24.5 56, 27 56, 28 54 C29 52, 28 48, 26 44 C24 39, 23 32, 23 25 Z" fill="url(#scan-grip)"/>
  
  <!-- Base de apoyo del mango -->
  <ellipse cx="25.5" cy="54.5" rx="3.5" ry="1.8" fill="#020617"/>

  <!-- Gatillo ergonómico amarillo / ámbar -->
  <path d="M22 26 C24.5 27.5, 25 31, 23.5 33 C22.5 32.5, 21.8 30.5, 21.5 28.5 Z" fill="url(#scan-trigger)"/>

  <!-- Cabezal principal del escáner (Perfil moderno con curvas) -->
  <path d="M7 16 C8 10, 15 7, 24 9 C31 10.5, 34 14, 35 18 C35.5 20, 35.5 24, 34 26 C31 30, 22 28, 16 25 C11 23, 6 21, 7 16 Z" fill="url(#scan-body)"/>

  <!-- Cubierta superior protectora de goma / antichoques -->
  <path d="M9 15 C10 11, 16 8.5, 24 10 C29 11, 33 13.5, 34 16 C30 14, 24 12, 18 12.5 C13 13, 10 14.5, 9 15 Z" fill="#64748b" opacity="0.65"/>

  <!-- Bisel frontal de la ventana óptica -->
  <path d="M33 17 L36 18.5 C36.5 20, 36.5 23.5, 35 25.5 L32 24 C33.5 22, 33.5 19, 33 17 Z" fill="url(#scan-bezel)"/>

  <!-- Ventana de salida del haz láser (Lente frontal verde esmeralda / oscura) -->
  <ellipse cx="34.2" cy="21.5" rx="1.6" ry="3.8" transform="rotate(15 34.2 21.5)" fill="url(#scan-lens)"/>
  <ellipse cx="34.2" cy="21.5" rx="0.9" ry="2.6" transform="rotate(15 34.2 21.5)" fill="#0f172a" opacity="0.8"/>

  <!-- LED indicador de lectura correcta (Luz verde / roja en la parte superior) -->
  <circle cx="16" cy="11.5" r="1.3" fill="#22c55e"/>
  <circle cx="16" cy="11.5" r="0.6" fill="#ffffff"/>
  <circle cx="16" cy="11.5" r="2.4" fill="#22c55e" opacity="0.35"/>

  <!-- Brillo especular curvo en la carcasa superior -->
  <path d="M12 14 C15 11, 22 10.5, 27 12 C23 11.5, 17 12.5, 13 15 Z" fill="#ffffff" opacity="0.45"/>
</svg>